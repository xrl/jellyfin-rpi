name: build-and-push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream jellyfin/jellyfin tag'
        default: '10.11.5'
      web_tag:
        description: 'xrl/jellyfin-web release tag'
        default: 'v10.11.5-xrl.1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.upstream_tag }}-manual-$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
            {
              echo "build_args<<EOF"
              echo "UPSTREAM_TAG=${{ inputs.upstream_tag }}"
              echo "WEB_TAG=${{ inputs.web_tag }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xrl/jellyfin-rpi:${{ steps.meta.outputs.tag }}
            ghcr.io/xrl/jellyfin-rpi:latest
          build-args: ${{ steps.meta.outputs.build_args }}
          provenance: false
