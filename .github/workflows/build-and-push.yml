name: build-and-push

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream jellyfin/jellyfin tag'
        default: '12.1'
        required: true
      web_tag:
        description: 'xrl/jellyfin-web release tag'
        default: 'v12.1-xrl.1'
        required: true
      server_sha256:
        description: 'Reviewed v12.1-rpi.2 Jellyfin.Api.dll release SHA256'
        default: 'ec256cfaf1a72819c71566963862319bb261da5a1c555b87e22d82abb1d0b1e4'
        required: true
      server_provenance_sha256:
        description: 'Reviewed v12.1-rpi.2 Jellyfin.Api.provenance.json SHA256'
        default: 'd64d873396ac90fd9320341d8ac7ff06fb9ba5808fbcf7a84d572f7e2a4dbc70'
        required: true

permissions:
  contents: read

jobs:
  native-amd64:
    uses: ./.github/workflows/native-amd64.yml
    permissions:
      contents: read
  build:
    needs: native-amd64
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          INPUT_WEB_TAG: ${{ inputs.web_tag }}
        run: |
          set -euo pipefail

          [ "$EVENT_NAME" = 'workflow_dispatch' ] || { echo 'Tag publication is disabled for this recipe' >&2; exit 1; }
          UPSTREAM_TAG="$INPUT_UPSTREAM_TAG"
          WEB_TAG="$INPUT_WEB_TAG"
          RELEASE_TAG="${UPSTREAM_TAG}-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAGS="ghcr.io/xrl/jellyfin-rpi:${RELEASE_TAG}"

          # Official upstream tags include 12.1 (not 12.1.0); retain older three-part tags.
          if ! [[ "$UPSTREAM_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid upstream tag: $UPSTREAM_TAG" >&2
            exit 1
          fi
          # This release branch pins the verified official 12.1 index; do not
          # silently build another version against that base.
          if [ "$UPSTREAM_TAG" != '12.1' ] || [ "$WEB_TAG" != 'v12.1-xrl.1' ]; then
            echo "This recipe requires official 12.1 and the pinned v12.1-xrl.1 web release" >&2
            exit 1
          fi

          {
            echo 'image_tags<<EOF'
            printf '%s\n' "$IMAGE_TAGS"
            echo 'EOF'
            echo "release_tag=$RELEASE_TAG"
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "web_tag=$WEB_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Verify pinned official index and platform manifests
        shell: bash
        run: |
          set -euo pipefail
          BASE_INDEX='78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e'
          BASE_ARM64='sha256:690b2dcb8f18f144d1091d728208a36e90cbf84a8811c9275b1e3bd96d52944f'
          BASE_AMD64='sha256:326be1010b16c92e492f6c7dd6fd105943db84ce723c73183279a1ab357b8f9b'
          RAW=$(docker buildx imagetools inspect --raw "jellyfin/jellyfin@sha256:$BASE_INDEX")
          [ "$(printf '%s' "$RAW" | sha256sum | cut -d' ' -f1)" = "$BASE_INDEX" ]
          printf '%s' "$RAW" | jq -e --arg digest "$BASE_ARM64" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $digest)] | length == 1' > /dev/null
          printf '%s' "$RAW" | jq -e --arg digest "$BASE_AMD64" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $digest)] | length == 1' > /dev/null
          for CHILD in "$BASE_ARM64" "$BASE_AMD64"; do
            CHILD_RAW=$(docker buildx imagetools inspect --raw "jellyfin/jellyfin@$CHILD")
            [ "sha256:$(printf '%s' "$CHILD_RAW" | sha256sum | cut -d' ' -f1)" = "$CHILD" ]
          done

      - name: Resolve web bundle checksum
        id: web
        shell: bash
        env:
          WEB_TAG: ${{ steps.meta.outputs.web_tag }}
        run: |
          set -euo pipefail
          CHECKSUM=$(curl --retry 5 --retry-all-errors -fsSL \
            "https://github.com/xrl/jellyfin-web/releases/download/${WEB_TAG}/jellyfin-web-dist.tar.gz.sha256")
          read -r WEB_SHA256 FILENAME <<< "$CHECKSUM"
          if ! [[ "$WEB_SHA256" =~ ^[0-9a-f]{64}$ ]] || [ "$FILENAME" != "jellyfin-web-dist.tar.gz" ]; then
            echo "Invalid checksum release asset for $WEB_TAG" >&2
            exit 1
          fi
          [ "$WEB_SHA256" = 'd07c1121f42beb81efa96e46a00fe309ac9cbc9ea4f415fe9f399f23a6af500e' ]
          echo "sha256=$WEB_SHA256" >> "$GITHUB_OUTPUT"

      - name: Require reviewed server release pins
        env:
          SERVER_SHA256: ${{ inputs.server_sha256 }}
          SERVER_PROVENANCE_SHA256: ${{ inputs.server_provenance_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$SERVER_SHA256" = 'ec256cfaf1a72819c71566963862319bb261da5a1c555b87e22d82abb1d0b1e4' ]
          [ "$SERVER_PROVENANCE_SHA256" = 'd64d873396ac90fd9320341d8ac7ff06fb9ba5808fbcf7a84d572f7e2a4dbc70' ]

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/xrl/jellyfin-rpi
            org.opencontainers.image.version=${{ steps.meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
            io.xrl.jellyfin.base-arm64-manifest=sha256:690b2dcb8f18f144d1091d728208a36e90cbf84a8811c9275b1e3bd96d52944f
            io.xrl.jellyfin.web-tag=${{ steps.meta.outputs.web_tag }}
            io.xrl.jellyfin.web-sha256=${{ steps.web.outputs.sha256 }}
          build-args: |
            UPSTREAM_BASE=docker.io/jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
            UPSTREAM_TAG=${{ steps.meta.outputs.upstream_tag }}
            WEB_TAG=${{ steps.meta.outputs.web_tag }}
            WEB_SHA256=${{ steps.web.outputs.sha256 }}
            SERVER_SHA256=${{ inputs.server_sha256 }}
            SERVER_PROVENANCE_SHA256=${{ inputs.server_provenance_sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
