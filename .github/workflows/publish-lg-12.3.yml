name: Publish LG 12.3-xrl.1

on:
  workflow_dispatch:
    inputs:
      confirm_fail_forward:
        description: Accept unverified synthetic streaming and validate on the C2 after deployment
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-lg-12.3-xrl.1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEB_TAG: v12.3-xrl.1
      WEB_SHA256: 2f57929ea98803cce140eb253e8b93d630e0064ee21aac5cbccbfa5809057e5a
      WEB_SOURCE_COMMIT: 41789c3e6f8176d605168f3e975e806961676244
      WEB_NODE_VERSION: v24.22.1
      WEB_LOCK_SHA256: 491d60a49385f31d481e9d55559e4ecb397a9110e0407e91453c91d77de9e160
      IMAGE: ghcr.io/xrl/jellyfin-rpi:12.3-xrl.1
    steps:
      - name: Require explicit fail-forward publication on main
        env:
          CONFIRM: ${{ inputs.confirm_fail_forward }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRM" = true
          [[ "$WEB_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo '::warning::Synthetic streaming and actual LG C2 acceptance have NOT passed. This is an explicit fail-forward publication.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch only the source-owned pinned web release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/xrl/jellyfin-web/git/ref/tags/$WEB_TAG" --jq '.object.sha')" = "$WEB_SOURCE_COMMIT"
          mkdir web-asset
          curl --retry 5 --retry-all-errors -fsSL \
            "https://github.com/xrl/jellyfin-web/releases/download/$WEB_TAG/jellyfin-web-dist.tar.gz" \
            -o web-asset/jellyfin-web-dist.tar.gz
          printf '%s  %s\n' "$WEB_SHA256" web-asset/jellyfin-web-dist.tar.gz | sha256sum -c -
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > existing-image.txt 2>&1; then
            echo 'Release tag already exists; publish a new version instead' >&2
            exit 1
          fi
          grep -Eiq 'not found|manifest unknown' existing-image.txt
      - name: Build and publish reviewed recipe without an API overlay
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.lg-candidate
          build-contexts: |
            web-asset=./web-asset
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ghcr.io/xrl/jellyfin-rpi:12.3-xrl.1
          labels: |
            campaign=dekopon
            org.opencontainers.image.version=12.3-xrl.1
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            WEB_TAG=${{ env.WEB_TAG }}
            WEB_SHA256=${{ env.WEB_SHA256 }}
            WEB_SOURCE_COMMIT=${{ env.WEB_SOURCE_COMMIT }}
            WEB_NODE_VERSION=${{ env.WEB_NODE_VERSION }}
            WEB_LOCK_SHA256=${{ env.WEB_LOCK_SHA256 }}
          provenance: mode=max
          sbom: true
      - name: Record immutable publication identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: %s@%s\n\nStreaming/C2 acceptance is unverified; owner approved fail-forward.\n' "$IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
