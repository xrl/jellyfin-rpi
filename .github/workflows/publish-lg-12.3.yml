name: Publish a Jellyfin 12.3 web update

on:
  workflow_dispatch:
    inputs:
      web_tag:
        description: Published Jellyfin Web tag (v12.3-xrl.N)
        required: true
        type: string
      web_sha256:
        description: Verified SHA-256 of jellyfin-web-dist.tar.gz
        required: true
        type: string
      web_source_commit:
        description: Reviewed commit referenced by the web release tag
        required: true
        type: string

concurrency:
  group: publish-jellyfin-web-12.3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WEB_TAG: ${{ inputs.web_tag }}
      WEB_SHA256: ${{ inputs.web_sha256 }}
      WEB_SOURCE_COMMIT: ${{ inputs.web_source_commit }}
    steps:
      - name: Validate reviewed publication inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$WEB_TAG" =~ ^v12\.3-xrl\.[1-9][0-9]*$ ]]
          [[ "$WEB_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WEB_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          printf 'IMAGE_VERSION=%s\nIMAGE=ghcr.io/xrl/jellyfin-rpi:%s\n' "${WEB_TAG#v}" "${WEB_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch only the source-owned pinned web release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/xrl/jellyfin-web/git/ref/tags/$WEB_TAG" --jq '.object.sha')" = "$WEB_SOURCE_COMMIT"
          mkdir web-asset
          curl --retry 5 --retry-all-errors -fsSL \
            "https://github.com/xrl/jellyfin-web/releases/download/$WEB_TAG/jellyfin-web-dist.tar.gz" \
            -o web-asset/jellyfin-web-dist.tar.gz
          printf '%s  %s\n' "$WEB_SHA256" web-asset/jellyfin-web-dist.tar.gz | sha256sum -c -
          read_source_file() {
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/xrl/jellyfin-web/contents/$1?ref=$WEB_SOURCE_COMMIT"
          }
          node_version=$(read_source_file .nvmrc)
          [[ "$node_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          lock_sha=$(read_source_file package-lock.json | sha256sum | cut -d' ' -f1)
          printf 'WEB_NODE_VERSION=v%s\nWEB_LOCK_SHA256=%s\n' "${node_version#v}" "$lock_sha" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > existing-image.txt 2>&1; then
            echo 'Release tag already exists; publish a new version instead' >&2
            exit 1
          fi
          grep -Eiq 'not found|manifest unknown' existing-image.txt
      - name: Build and publish reviewed recipe without an API overlay
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.lg-candidate
          build-contexts: |
            web-asset=./web-asset
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            campaign=dekopon
            org.opencontainers.image.version=${{ env.IMAGE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            WEB_TAG=${{ env.WEB_TAG }}
            WEB_SHA256=${{ env.WEB_SHA256 }}
            WEB_SOURCE_COMMIT=${{ env.WEB_SOURCE_COMMIT }}
            WEB_NODE_VERSION=${{ env.WEB_NODE_VERSION }}
            WEB_LOCK_SHA256=${{ env.WEB_LOCK_SHA256 }}
          provenance: mode=max
          sbom: true
      - name: Record immutable publication identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: %s@%s\n\nWeb source: %s at %s\n' "$IMAGE" "$IMAGE_DIGEST" "$WEB_TAG" "$WEB_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
